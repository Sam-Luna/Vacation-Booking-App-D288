spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ecommerceapp
spring.datasource.password=ecommerceapp
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.data.rest.base-path=/api
# allow jackson parser to process comments in payload
spring.jackson.parser.allow-comments=true
# application logging level
logging.level.org.springframework=DEBUG
# Forces Spring and Hibernate to instantly save and commit transactions to the database
#spring.jpa.properties.hibernate.connection.autocommit=true
# Forces Spring to log the hidden exception BEFORE forwarding to /error
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.data.rest=TRACE